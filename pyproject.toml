[project]
name = "homeplanner"
version = "0.1.0"
description = "A family wall calendar for the Raspberry Pi, synced with a shared Google Calendar"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "De Clercq Wentzel" }]
keywords = ["raspberry-pi", "calendar", "google-calendar", "kiosk", "family", "wall-display"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
]
# 3.11 is the oldest Python on current Raspberry Pi OS releases.
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "google-api-python-client>=2.130",
    "google-auth>=2.30",
    "icalendar>=6.0",
    "recurring-ical-events>=3.3",
]

[project.optional-dependencies]
pi = ["evdev>=1.7"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homeplanner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
