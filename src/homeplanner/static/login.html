<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HomePlanner sign-in</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="page">
  <main class="card narrow">
    <h1>HomePlanner</h1>
    <p class="muted">Enter the PIN set on the wall display.</p>
    <form id="login-form" autocomplete="off">
      <label class="field">
        <span>PIN</span>
        <input id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]*"
               minlength="6" maxlength="8" required autofocus>
      </label>
      <p id="login-error" class="form-error" role="alert" hidden></p>
      <button type="submit" class="primary wide-button" id="login-button">Sign in</button>
    </form>
  </main>
  <script src="/login.js"></script>
</body>
</html>
